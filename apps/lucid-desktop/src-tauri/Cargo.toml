[workspace]

[package]
name = "lucid-desktop"
version = "0.2.0"
description = "LUCID cross-platform desktop app (Tauri v2 + sandboxed lucidd sidecar)"
authors = ["Phase Contributors"]
license = "AGPL-3.0-or-later"
edition = "2021"
rust-version = "1.88"

[lib]
name = "lucid_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-deep-link = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "process", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
dirs = "5"
url = "2"
anyhow = "1"

[dev-dependencies]
tempfile = "3"
