# SPDX-License-Identifier: Apache-2.0
[package]
name = "phase-protocol"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
description = "The Worker trait and JobSpec enum — the abstraction every Phase node implementation impls."
authors.workspace = true
repository.workspace = true
readme = "README.md"

[dependencies]
phase-manifest = { path = "../phase-manifest", version = "0.1.0" }
phase-receipt = { path = "../phase-receipt", version = "0.1.0" }

tokio = { workspace = true, features = ["sync", "macros", "rt"] }
futures-core.workspace = true

serde.workspace = true
serde_bytes.workspace = true
bytes = { workspace = true, features = ["serde"] }
sha2.workspace = true
thiserror.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }
futures-util.workspace = true
async-stream.workspace = true
serde_json.workspace = true
phase-identity = { path = "../phase-identity" }

[features]
default = []
# Historical: was used to gate placeholder envelopes during M1-M4.
real-envelopes = []
