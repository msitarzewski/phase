[package]
name = "plasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors = ["PhaseBased <hello@phasebased.com>", "Michael Sitarzewski"]
description = "Reference WASM Phase node — Wasmtime-based Worker implementation."
license = "Apache-2.0"
repository.workspace = true
readme = "README.md"

[lib]
name = "plasm"
path = "src/lib.rs"

[[bin]]
name = "plasmd"
path = "src/main.rs"

[[bin]]
name = "phase-discover"
path = "src/bin/phase_discover.rs"

[[bin]]
name = "phase-verify"
path = "src/bin/phase_verify.rs"

[[bin]]
name = "phase-fetch"
path = "src/bin/phase_fetch.rs"

[dependencies]
phase-identity = { path = "../phase-identity", version = "0.1.0" }
phase-manifest = { path = "../phase-manifest", version = "0.1.0" }
phase-receipt = { path = "../phase-receipt", version = "0.1.0" }
phase-net = { path = "../phase-net", version = "0.1.0" }
phase-protocol = { path = "../phase-protocol", version = "0.1.0" }
phase-artifact-server = { path = "../phase-artifact-server", version = "0.1.0" }

# Keep the runtime and WASI adapter on the same 36.x LTS security baseline.
wasmtime = "36.0.20"
wasmtime-wasi = "36.0.20"

serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

ed25519-dalek.workspace = true
sha2.workspace = true
hex.workspace = true
base64.workspace = true

tokio = { workspace = true, features = ["rt", "rt-multi-thread", "net", "fs", "io-util", "sync", "time", "macros", "signal"] }
tokio-util = { workspace = true, features = ["io"] }
async-trait.workspace = true

clap.workspace = true
uuid.workspace = true
dirs.workspace = true
chrono = { workspace = true, features = ["serde"] }

libp2p = { workspace = true, features = ["kad", "noise", "tcp", "quic", "yamux", "macros", "tokio", "relay", "dcutr", "autonat", "identify", "mdns"] }
futures.workspace = true
num_cpus.workspace = true
rand = "0.8"

reqwest = { workspace = true, features = ["blocking"] }

axum = { workspace = true, features = ["tokio", "http1", "http2"] }

bytes.workspace = true
futures-util.workspace = true
async-stream.workspace = true

[dev-dependencies]
tempfile.workspace = true
assert_matches = "1.5"

[package.metadata.deb]
maintainer = "PhaseBased <hello@phasebased.com>"
copyright = "2025, PhaseBased"
license-file = ["../../LICENSE", "0"]
extended-description = """\
Phase is an open protocol for distributed computation. \
Plasm is the local runtime engine that turns any computer into a node in the network. \
This package provides the plasmd daemon for executing WebAssembly workloads."""
depends = "$auto, systemd"
section = "net"
priority = "optional"
assets = [
    ["target/release/plasmd", "usr/bin/", "755"],
    ["../../README.md", "usr/share/doc/plasm/", "644"],
    ["systemd/plasmd.service", "lib/systemd/system/", "644"],
]
maintainer-scripts = "debian/"
systemd-units = { unit-name = "plasmd", enable = false }
