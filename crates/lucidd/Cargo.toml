[package]
name = "lucidd"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license = "AGPL-3.0-or-later"
description = "LUCID inference daemon — open GPU inference flagship built on the Phase substrate."
authors.workspace = true
repository.workspace = true
readme = "README.md"
include = [
    "src/**",
    "tests/**",
    "systemd/**",
    "Cargo.toml",
    "README.md",
]

[lib]
path = "src/lib.rs"

[[bin]]
name = "lucidd"
path = "src/main.rs"

[dependencies]
phase-protocol = { path = "../phase-protocol" }
phase-identity = { path = "../phase-identity" }
phase-manifest = { path = "../phase-manifest" }
phase-receipt = { path = "../phase-receipt" }
phase-net = { path = "../phase-net" }
phase-artifact-server = { path = "../phase-artifact-server" }
ed25519-dalek.workspace = true
postcard.workspace = true
sha2.workspace = true
hex.workspace = true
hickory-resolver = { version = "0.26", default-features = false, features = ["tokio", "system-config"] }
async-trait.workspace = true
anyhow.workspace = true
thiserror.workspace = true

axum = { workspace = true, features = ["macros"] }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "net", "fs", "io-util", "sync", "time", "macros", "process", "signal"] }
tower.workspace = true
tower-http = { workspace = true, features = ["cors", "trace"] }
hyper.workspace = true

futures.workspace = true
futures-util.workspace = true
async-stream.workspace = true
bytes.workspace = true

serde.workspace = true
serde_json.workspace = true

base64.workspace = true
uuid.workspace = true

tracing.workspace = true
tracing-subscriber.workspace = true

clap.workspace = true
reqwest = { workspace = true, features = ["stream"] }
dashmap = "6"

notify = "6"
battery = "0.7"
sysinfo = "0.32"
glob = "0.3"
dirs.workspace = true
toml = "0.8"
chrono.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "net", "fs", "io-util", "sync", "time", "macros", "process", "signal", "test-util"] }
axum = { workspace = true, features = ["macros"] }
hyper = { workspace = true, features = ["server"] }
