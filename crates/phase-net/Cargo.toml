# SPDX-License-Identifier: Apache-2.0
[package]
name = "phase-net"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
description = "libp2p, Kademlia DHT, mDNS, and Noise+QUIC transport for decentralized Phase peer discovery and capability advertisement."
authors.workspace = true
repository.workspace = true
readme = "README.md"

[dependencies]
phase-identity = { path = "../phase-identity", version = "0.1.0" }
phase-protocol = { path = "../phase-protocol", version = "0.1.0" }

libp2p = { workspace = true, features = [
    "kad",
    "noise",
    "tcp",
    "quic",
    "yamux",
    "macros",
    "tokio",
    "relay",
    "dcutr",
    "autonat",
    "identify",
    "rendezvous",
    "mdns",
    "request-response",
    "json",
    "cbor",
] }
libp2p-stream = "0.5.0-alpha"

tokio = { workspace = true, features = ["rt", "rt-multi-thread", "sync", "time", "macros", "net", "io-util"] }
futures.workspace = true
async-trait.workspace = true

serde.workspace = true
serde_json.workspace = true
serde_bytes.workspace = true
base64.workspace = true
postcard.workspace = true

ed25519-dalek.workspace = true
tracing.workspace = true
anyhow.workspace = true
thiserror.workspace = true
num_cpus.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "sync", "time", "macros", "net", "io-util", "test-util"] }
