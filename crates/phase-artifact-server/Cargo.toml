# SPDX-License-Identifier: Apache-2.0
[package]
name = "phase-artifact-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
description = "Content-addressed HTTP server for distributing any signed blob across the Phase network."
authors.workspace = true
repository.workspace = true
readme = "README.md"

[dependencies]
libp2p = { workspace = true, features = ["kad"] }

axum = { workspace = true, features = ["tokio", "http1", "http2"] }
tower.workspace = true
tower-http = { workspace = true, features = ["trace"] }

tokio = { workspace = true, features = ["rt", "rt-multi-thread", "net", "fs", "io-util", "sync", "macros", "time"] }
tokio-util = { workspace = true, features = ["io"] }

serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
ring = "0.17"
hex.workspace = true
chrono = { workspace = true, features = ["serde"] }
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true
reqwest.workspace = true
