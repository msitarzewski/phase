# Build and publish installable LUCID release bundles (Linux x86_64, Linux ARM64,
# macOS Apple Silicon CLI + native LUCID.app) with SHA-256 checksums.
#
# Triggered automatically on `v*` tags or manually via `workflow_dispatch` (e.g.
# prerelease test candidates so every test machine installs via
# `scripts/install-lucid.sh` with zero manual file copying).

name: Release Bundles

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create/update (e.g. v0.2.0-rc1)"
        required: true
        type: string
      prerelease:
        description: "Mark GitHub Release as a prerelease"
        required: false
        default: true
        type: boolean

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-linux:
    name: Build Linux (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            apps/lucid-desktop/src-tauri -> target

      - name: Build and verify release bundle
        env:
          # Pin baseline x86-64 codegen on Linux x86_64 so C/assembly crypto
          # dependencies (such as aws-lc-sys) never emit BMI1/AVX2 instructions
          # that SIGILL on pre-Haswell Intel/AMD CPUs (e.g. Ivy Bridge).
          CFLAGS: ${{ matrix.target == 'x86_64-unknown-linux-gnu' && '-march=x86-64 -mno-bmi -mno-bmi2 -mno-avx2' || '' }}
          CXXFLAGS: ${{ matrix.target == 'x86_64-unknown-linux-gnu' && '-march=x86-64 -mno-bmi -mno-bmi2 -mno-avx2' || '' }}
          CMAKE_C_FLAGS: ${{ matrix.target == 'x86_64-unknown-linux-gnu' && '-march=x86-64 -mno-bmi -mno-bmi2 -mno-avx2' || '' }}
          RUSTFLAGS: ${{ matrix.target == 'x86_64-unknown-linux-gnu' && '-C target-cpu=x86-64' || '' }}
        run: |
          cargo fetch --locked
          scripts/phase-validate.sh --evidence-dir "$RUNNER_TEMP/release-out" release
          mkdir -p "$RUNNER_TEMP/dist-upload"
          cp "$RUNNER_TEMP"/release-out/*/lucidd-*-${{ matrix.target }}.tar.gz "$RUNNER_TEMP/dist-upload/"

      - name: Install Linux Tauri desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build LUCID Desktop (.deb)
        working-directory: apps/lucid-desktop
        run: |
          bash stage-sidecar.sh "$GITHUB_WORKSPACE/target/release/lucidd"
          npm ci
          npm run check
          npx tauri build --bundles deb
          cp src-tauri/target/release/bundle/deb/*.deb "$RUNNER_TEMP/dist-upload/"

      - name: Upload Linux bundle
        uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/dist-upload/*.tar.gz
            ${{ runner.temp }}/dist-upload/*.deb

  build-macos:
    name: Build macOS Apple Silicon (CLI + LUCID.app)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            apps/lucid-desktop/src-tauri -> target

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build CLI bundle and LUCID Desktop (.dmg + .app.zip)
        run: |
          cargo fetch --locked
          scripts/phase-validate.sh --evidence-dir "$RUNNER_TEMP/release-out" release
          VERSION="$(awk -F '"' '/^version = / { print $2; exit }' crates/lucidd/Cargo.toml)"
          mkdir -p "$RUNNER_TEMP/dist-upload"
          cp "$RUNNER_TEMP"/release-out/*/lucidd-*-aarch64-apple-darwin.tar.gz "$RUNNER_TEMP/dist-upload/"
          (
            cd apps/lucid-desktop
            bash stage-sidecar.sh "$GITHUB_WORKSPACE/target/release/lucidd"
            npm ci
            npm run check
            npx tauri build --bundles app,dmg
            codesign --force --deep --sign - --timestamp=none src-tauri/target/release/bundle/macos/LUCID.app
            codesign --verify --deep --strict src-tauri/target/release/bundle/macos/LUCID.app
            ditto -c -k --sequesterRsrc --keepParent \
              src-tauri/target/release/bundle/macos/LUCID.app \
              "$RUNNER_TEMP/dist-upload/LUCID-${VERSION}-aarch64-apple-darwin.zip"
            cp src-tauri/target/release/bundle/dmg/*.dmg "$RUNNER_TEMP/dist-upload/"
          )

      - name: Upload macOS bundles
        uses: actions/upload-artifact@v4
        with:
          name: bundle-aarch64-apple-darwin
          path: |
            ${{ runner.temp }}/dist-upload/*.tar.gz
            ${{ runner.temp }}/dist-upload/*.zip
            ${{ runner.temp }}/dist-upload/*.dmg

  publish:
    name: Checksum & Publish GitHub Release
    needs: [build-linux, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Generate SHA256SUMS.txt
        working-directory: release-artifacts
        run: |
          LC_ALL=C sha256sum -- *.tar.gz *.zip *.dmg *.deb | sort -k2 > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Resolve release tag
        id: meta
        env:
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            echo "tag=$INPUT_TAG" >> "$GITHUB_OUTPUT"
            echo "prerelease=$INPUT_PRERELEASE" >> "$GITHUB_OUTPUT"
          else
            TAG="${GITHUB_REF#refs/tags/}"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            case "$TAG" in
              *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
              *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
            esac
          fi

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.meta.outputs.tag }}
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
        run: |
          FLAGS=(--verify-tag=false --target "$GITHUB_SHA" --generate-notes)
          if [ "$PRERELEASE" = "true" ]; then
            FLAGS+=(--prerelease)
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-artifacts/* --clobber
          else
            gh release create "$TAG" release-artifacts/* "${FLAGS[@]}"
          fi
