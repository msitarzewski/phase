# Build and publish installable LUCID release bundles (Linux x86_64, Linux ARM64,
# macOS Apple Silicon, and Windows x86_64 CLI + native desktop packages) with
# SHA-256 checksums.
#
# Triggered automatically on `v*` tags or manually via `workflow_dispatch` (e.g.
# prerelease test candidates so every test machine installs via
# `scripts/install-lucid.sh` with zero manual file copying).

name: Release Bundles

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create/update (e.g. v0.2.0-rc1)"
        required: true
        type: string
      prerelease:
        description: "Mark GitHub Release as a prerelease"
        required: false
        default: true
        type: boolean
      require_windows_signing:
        description: "Fail Windows build if Azure Artifact Signing secrets are not configured"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-linux:
    name: Build Linux (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            apps/lucid-desktop/src-tauri -> target

      - name: Build and verify release bundle
        env:
          # Pin baseline x86-64 codegen on Linux x86_64 so C/assembly crypto
          # dependencies (such as aws-lc-sys) never emit BMI1/AVX2 instructions
          # that SIGILL on pre-Haswell Intel/AMD CPUs (e.g. Ivy Bridge).
          CFLAGS: ${{ matrix.target == 'x86_64-unknown-linux-gnu' && '-march=x86-64 -mno-bmi -mno-bmi2 -mno-avx2' || '' }}
          CXXFLAGS: ${{ matrix.target == 'x86_64-unknown-linux-gnu' && '-march=x86-64 -mno-bmi -mno-bmi2 -mno-avx2' || '' }}
          CMAKE_C_FLAGS: ${{ matrix.target == 'x86_64-unknown-linux-gnu' && '-march=x86-64 -mno-bmi -mno-bmi2 -mno-avx2' || '' }}
          RUSTFLAGS: ${{ matrix.target == 'x86_64-unknown-linux-gnu' && '-C target-cpu=x86-64' || '' }}
        run: |
          cargo fetch --locked
          scripts/phase-validate.sh --evidence-dir "$RUNNER_TEMP/release-out" release
          mkdir -p "$RUNNER_TEMP/dist-upload"
          cp "$RUNNER_TEMP"/release-out/*/lucidd-*-${{ matrix.target }}.tar.gz "$RUNNER_TEMP/dist-upload/"

      - name: Install Linux Tauri desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build LUCID Desktop (.deb)
        working-directory: apps/lucid-desktop
        run: |
          bash stage-sidecar.sh "$GITHUB_WORKSPACE/target/release/lucidd"
          npm ci
          npm run check
          npx tauri build --bundles deb
          cp src-tauri/target/release/bundle/deb/*.deb "$RUNNER_TEMP/dist-upload/"

      - name: Upload Linux bundle
        uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/dist-upload/*.tar.gz
            ${{ runner.temp }}/dist-upload/*.deb

  build-macos:
    name: Build macOS Apple Silicon (CLI + LUCID.app)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            apps/lucid-desktop/src-tauri -> target

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build CLI bundle and LUCID Desktop (.dmg + .app.zip)
        run: |
          cargo fetch --locked
          scripts/phase-validate.sh --evidence-dir "$RUNNER_TEMP/release-out" release
          VERSION="$(awk -F '"' '/^version = / { print $2; exit }' crates/lucidd/Cargo.toml)"
          mkdir -p "$RUNNER_TEMP/dist-upload"
          cp "$RUNNER_TEMP"/release-out/*/lucidd-*-aarch64-apple-darwin.tar.gz "$RUNNER_TEMP/dist-upload/"
          (
            cd apps/lucid-desktop
            bash stage-sidecar.sh "$GITHUB_WORKSPACE/target/release/lucidd"
            npm ci
            npm run check
            npx tauri build --bundles app,dmg
            # CI intentionally holds zero Apple signing credentials. Ad-hoc sign
            # here for unsigned CI artifacts; maintainers sign, notarize, and
            # staple release builds locally with macOS Keychain via:
            #   scripts/sign-macos-release.sh --from-release <tag> --publish <tag>
            codesign --force --deep --sign - --timestamp=none src-tauri/target/release/bundle/macos/LUCID.app
            codesign --verify --deep --strict src-tauri/target/release/bundle/macos/LUCID.app
            ditto -c -k --sequesterRsrc --keepParent \
              src-tauri/target/release/bundle/macos/LUCID.app \
              "$RUNNER_TEMP/dist-upload/LUCID-${VERSION}-aarch64-apple-darwin.zip"
            cp src-tauri/target/release/bundle/dmg/*.dmg "$RUNNER_TEMP/dist-upload/"
          )

      - name: Upload macOS bundles
        uses: actions/upload-artifact@v4
        with:
          name: bundle-aarch64-apple-darwin
          path: |
            ${{ runner.temp }}/dist-upload/*.tar.gz
            ${{ runner.temp }}/dist-upload/*.zip
            ${{ runner.temp }}/dist-upload/*.dmg

  build-windows-x86_64:
    name: Build Windows x86_64 (CLI)
    runs-on: windows-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Build Windows CLI
        shell: pwsh
        run: |
          cargo fetch --locked
          cargo build --release --locked --bin lucidd --target x86_64-pc-windows-msvc

      - name: Check Windows signing configuration
        id: sign_cfg
        shell: pwsh
        env:
          SIGN_ENDPOINT: ${{ secrets.LUCID_AZURE_SIGN_ENDPOINT }}
          SIGN_ACCOUNT: ${{ secrets.LUCID_AZURE_SIGN_ACCOUNT }}
          SIGN_PROFILE: ${{ secrets.LUCID_AZURE_SIGN_PROFILE }}
          AZ_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZ_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZ_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZ_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          REQUIRE_SIGNING: ${{ inputs.require_windows_signing }}
        run: |
          $signVars = @($env:SIGN_ENDPOINT, $env:SIGN_ACCOUNT, $env:SIGN_PROFILE) | Where-Object { -not [string]::IsNullOrWhiteSpace($_) }
          if ($signVars.Count -eq 0) {
            if ($env:REQUIRE_SIGNING -eq 'true') {
              throw "require_windows_signing=true, but LUCID_AZURE_SIGN_* secrets are not configured in the 'release' environment."
            }
            Write-Host "Windows signing skipped: LUCID_AZURE_SIGN_* secrets not configured."
            "mode=skip" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            exit 0
          }
          if ($signVars.Count -ne 3) {
            throw "Partial Azure Artifact Signing configuration detected ($($signVars.Count)/3 LUCID_AZURE_SIGN_* secrets set). Configure all three or none."
          }
          $hasClient = -not [string]::IsNullOrWhiteSpace($env:AZ_CLIENT_ID)
          $hasTenant = -not [string]::IsNullOrWhiteSpace($env:AZ_TENANT_ID)
          $hasSecret = -not [string]::IsNullOrWhiteSpace($env:AZ_CLIENT_SECRET)
          $hasSub    = -not [string]::IsNullOrWhiteSpace($env:AZ_SUBSCRIPTION_ID)
          if ($hasClient -and $hasTenant -and $hasSecret) {
            Write-Host "Windows signing enabled (Azure Artifact Signing via Service Principal)."
            "mode=sp" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          } elseif ($hasClient -and $hasTenant -and $hasSub) {
            Write-Host "Windows signing enabled (Azure Artifact Signing via GitHub OIDC)."
            "mode=oidc" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          } else {
            throw "LUCID_AZURE_SIGN_* secrets are set, but Azure auth is incomplete. Provide AZURE_CLIENT_ID + AZURE_TENANT_ID + (AZURE_SUBSCRIPTION_ID for OIDC or AZURE_CLIENT_SECRET for Service Principal)."
          }

      - name: Azure Login (OIDC)
        if: steps.sign_cfg.outputs.mode == 'oidc'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          enable-AzPSSession: false

      - name: Sign and verify lucidd.exe (Azure Artifact Signing)
        if: steps.sign_cfg.outputs.mode != 'skip'
        shell: pwsh
        env:
          LUCID_AZURE_SIGN_ENDPOINT: ${{ secrets.LUCID_AZURE_SIGN_ENDPOINT }}
          LUCID_AZURE_SIGN_ACCOUNT: ${{ secrets.LUCID_AZURE_SIGN_ACCOUNT }}
          LUCID_AZURE_SIGN_PROFILE: ${{ secrets.LUCID_AZURE_SIGN_PROFILE }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          pwsh -NoProfile -File scripts/sign-windows-binary.ps1 `
            -Path "target\x86_64-pc-windows-msvc\release\lucidd.exe"

      - name: Azure Logout (OIDC)
        if: always() && steps.sign_cfg.outputs.mode == 'oidc'
        shell: pwsh
        run: az logout 2>$null; exit 0

      - name: Package Windows CLI
        shell: pwsh
        run: |
          $versionMatch = Select-String `
            -Path crates/lucidd/Cargo.toml `
            -Pattern '^version = "([^"]+)"' `
            -CaseSensitive | Select-Object -First 1
          if ($null -eq $versionMatch) {
            throw "Could not read lucidd version from crates/lucidd/Cargo.toml"
          }
          $version = $versionMatch.Matches[0].Groups[1].Value
          $bundleName = "lucidd-$version-x86_64-pc-windows-msvc"
          $stage = Join-Path $env:RUNNER_TEMP "$bundleName"
          $upload = Join-Path $env:RUNNER_TEMP "dist-upload"
          New-Item -ItemType Directory -Force -Path "$stage\bin", $upload | Out-Null
          Copy-Item `
            "target\x86_64-pc-windows-msvc\release\lucidd.exe" `
            "$stage\bin\lucidd.exe"
          & "$stage\bin\lucidd.exe" --help | Out-Null
          Compress-Archive `
            -Path "$stage\*" `
            -DestinationPath "$upload\$bundleName.zip" `
            -CompressionLevel Optimal

      - name: Upload Windows bundle
        uses: actions/upload-artifact@v4
        with:
          name: bundle-x86_64-pc-windows-msvc
          path: ${{ runner.temp }}/dist-upload/*.zip

  publish:
    name: Checksum & Publish GitHub Release
    needs: [build-linux, build-macos, build-windows-x86_64]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Generate SHA256SUMS.txt
        working-directory: release-artifacts
        run: |
          LC_ALL=C sha256sum -- *.tar.gz *.zip *.dmg *.deb | sort -k2 > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Resolve release tag
        id: meta
        env:
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            echo "tag=$INPUT_TAG" >> "$GITHUB_OUTPUT"
            echo "prerelease=$INPUT_PRERELEASE" >> "$GITHUB_OUTPUT"
          else
            TAG="${GITHUB_REF#refs/tags/}"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            case "$TAG" in
              *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
              *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
            esac
          fi

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.meta.outputs.tag }}
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
        run: |
          FLAGS=(--verify-tag=false --target "$GITHUB_SHA" --generate-notes)
          if [ "$PRERELEASE" = "true" ]; then
            FLAGS+=(--prerelease)
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-artifacts/* --clobber
          else
            gh release create "$TAG" release-artifacts/* "${FLAGS[@]}"
          fi
